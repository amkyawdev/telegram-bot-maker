<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Bot Maker - AI Powered</title>
    <link rel="stylesheet" href="vendor/bootstrap.min.css">
    <link rel="stylesheet" href="vendor/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="vendor/vue.js"></script>
</head>
<body>
    <div id="app">
        <loader v-if="currentPage === 'loader'"></loader>
        <main-page v-else-if="currentPage === 'main'" @navigate="navigate"></main-page>
        <api-config v-else-if="currentPage === 'api'" @navigate="navigate"></api-config>
        <system-prompt v-else-if="currentPage === 'prompt'" @navigate="navigate"></system-prompt>
        <bot-list v-else-if="currentPage === 'bots'" @navigate="navigate"></bot-list>
        <about v-else-if="currentPage === 'about'"></about>
    </div>

    <script src="js/data/models.js"></script>
    <script src="js/composables/useStorage.js"></script>
    <script src="js/composables/useApiTest.js"></script>
    <script src="js/composables/useBotManager.js"></script>
    <script src="js/components/Loader.js"></script>
    <script src="js/components/MainPage.js"></script>
    <script src="js/components/ApiConfig.js"></script>
    <script src="js/components/SystemPrompt.js"></script>
    <script src="js/components/BotList.js"></script>
    <script src="js/components/About.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
